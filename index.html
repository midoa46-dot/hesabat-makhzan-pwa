<script>
(function(){
'use strict';
var KEY='hesabat-makhzan-v1';
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var storageOk=true;
var ui={tab:'stock',sup:null,par:null,pending:null,locked:false,pinBuf:'',all:false};
var sheet=null,allTimer=null,DL=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(function(d){DL=d;if(ui.tab==='more'&&!sheet&&!ui.locked)render();}).catch(function(){});}catch(e){}

/* ---------- البيانات ---------- */
function blank(){return {v:2,seq:0,suppliers:[],parties:[],entries:[],settings:{pin:null,lastPct:10,lastBackup:null}};}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOk=false;return blank();}
  if(!raw)return blank();
  try{
    var o=JSON.parse(raw),b=blank();
    o.settings=Object.assign(b.settings,o.settings||{});
    return Object.assign(b,o);
  }catch(e){
    try{localStorage.setItem(KEY+'-corrupt',raw);}catch(_){}
    return blank();
  }
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}catch(e){storageOk=false;}}
function nid(p){S.seq+=1;return p+S.seq;}


var IC={stock:'M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z M3 7.5l9 4.5 9-4.5 M12 12v9',
sup:'M2 6h11v10H2z M13 10h4l3 3v3h-7z M6 17.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z M17 17.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z',
cust:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6 M16 4.3a3.5 3.5 0 0 1 0 6.4 M18 14.4c2 .7 3.5 2.5 3.5 5.6',
shop:'M4 9l1.5-5h13L20 9 M4 9v11h16V9 M4 9c0 1.7 1.3 3 2.7 3S9.3 10.7 9.3 9c0 1.7 1.3 3 2.7 3s2.7-1.3 2.7-3c0 1.7 1.3 3 2.7 3S20 10.7 20 9 M10 20v-5h4v5',
cash:'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l12-3v3 M16 14h2',
log:'M8 6h12 M8 12h12 M8 18h12 M4 6h.01 M4 12h.01 M4 18h.01',
plus:'M12 5v14M5 12h14',in:'M17 7 7 17 M7 8v9h9',out:'M7 17 17 7 M8 7h9v9',
search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M21 21l-4.5-4.5',
eye:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
eyeoff:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M4 4l16 16',
undo:'M9 14 4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3',save:'M12 4v11 M7 11l5 5 5-5 M5 20h14',more:'M5 12h.01 M12 12h.01 M19 12h.01'};
function ic(k){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="'+IC[k]+'"/></svg>';}
/* ---------- أدوات ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r2(x){return Math.round((x+Number.EPSILON)*100)/100;}
function parseNum(s){
  s=String(s==null?'':s);
  s=s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});
  s=s.replace(/[٬,\s]/g,'').replace(/٫/g,'.');
  if(s==='')return NaN;
  var v=Number(s);return isFinite(v)?v:NaN;
}
function fmt(x){return Math.abs(r2(x)).toLocaleString('en-US',{maximumFractionDigits:2});}
/* رقم مخفي: يظهر بالضغط */
function sx(t){return '<span class="num sec" role="button" tabindex="0" aria-label="إظهار الرقم"><span class="sv">'+t+'</span><span class="sx" aria-hidden="true">••••</span></span>';}
function n(x){return sx((r2(x)<0?'−':'')+fmt(x));}
/* رقم ظاهر (داخل نوافذ الإدخال) */
function nv(x){return '<span class="num">'+(r2(x)<0?'−':'')+fmt(x)+'</span>';}
function money(x,cls){return '<span class="'+(cls||'')+'">'+n(x)+'<span class="unit">ج.م</span></span>';}
function signed(x){var v=r2(x);if(v===0)return n(0);return sx((v>0?'+':'−')+fmt(v));}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){
  var p=String(s||'').split('-');if(p.length!==3)return esc(s||'');
  var y=+p[0],m=+p[1],d=+p[2];
  return d+' '+MONTHS[m-1]+(y!==new Date().getFullYear()?' '+y:'');
}
function supName(id){for(var i=0;i<S.suppliers.length;i++)if(S.suppliers[i].id===id)return esc(S.suppliers[i].name);return 'مورد محذوف';}
function parName(id){if(id==='shop')return 'المحل';for(var i=0;i<S.parties.length;i++)if(S.parties[i].id===id)return esc(S.parties[i].name);return 'عميل محذوف';}
function byId(id){for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===id)return S.entries[i];return null;}

/* ---------- الحسابات: كل الأرصدة بتتحسب من الحركات ---------- */
var KEYS=['cost','sale','supplied','paid','issued','received','cash'];
function zero(){return {sup:null,party:null,cost:0,sale:0,supplied:0,paid:0,issued:0,received:0,cash:0};}
function fx(e){
  var f=zero();
  switch(e.type){
    case 'supply':f.sup=e.sup;f.cost=e.cost;f.sale=r2(e.cost*(1+e.pct/100));f.supplied=e.cost;f.paid=e.paid||0;f.cash=-(e.paid||0);break;
    case 'pay':f.sup=e.sup;f.paid=e.amount;f.cash=-e.amount;break;
    case 'issue':f.party=e.party;f.cost=-e.costOut;f.sale=-e.amount;f.issued=e.amount;f.received=e.paid||0;f.cash=e.paid||0;break;
    case 'collect':f.party=e.party;f.received=e.amount;f.cash=e.party==='shop'?0:e.amount;break;
    case 'close':f.cash=e.net;break;
    case 'deposit':f.cash=e.amount;break;
    case 'withdraw':f.cash=-e.amount;break;
    case 'adjust':f.cash=e.amount;break;
    case 'reversal':
      var o=byId(e.ref);
      if(o){var g=fx(o);f.sup=g.sup;f.party=g.party;KEYS.forEach(function(k){f[k]=-g[k];});}
      break;
  }
  return f;
}
function calc(){
  var T={cost:0,sale:0,cash:0,owed:0,recv:0,sup:{},par:{}};
  S.suppliers.forEach(function(s){T.sup[s.id]={supplied:0,paid:0,left:0};});
  T.par.shop={issued:0,received:0,left:0};
  S.parties.forEach(function(p){T.par[p.id]={issued:0,received:0,left:0};});
  S.entries.forEach(function(e){
    var f=fx(e);T.cost+=f.cost;T.sale+=f.sale;T.cash+=f.cash;
    if(f.sup&&T.sup[f.sup]){T.sup[f.sup].supplied+=f.supplied;T.sup[f.sup].paid+=f.paid;}
    if(f.party&&T.par[f.party]){T.par[f.party].issued+=f.issued;T.par[f.party].received+=f.received;}
  });
  S.suppliers.forEach(function(s){var t=T.sup[s.id];t.supplied=r2(t.supplied);t.paid=r2(t.paid);t.left=r2(t.supplied-t.paid);T.owed+=t.left;});
  Object.keys(T.par).forEach(function(k){var t=T.par[k];t.issued=r2(t.issued);t.received=r2(t.received);t.left=r2(t.issued-t.received);T.recv+=t.left;});
  T.cost=r2(T.cost);T.sale=r2(T.sale);T.cash=r2(T.cash);T.owed=r2(T.owed);T.recv=r2(T.recv);
  T.net=r2(T.cash+T.recv+T.sale-T.owed);
  return T;
}
function reversedSet(){var s={};S.entries.forEach(function(e){if(e.type==='reversal')s[e.ref]=1;});return s;}
function entrySup(e){if(e.type==='reversal'){var o=byId(e.ref);return o?o.sup:null;}return e.sup;}
function entryPar(e){if(e.type==='reversal'){var o=byId(e.ref);return o?o.party:null;}return e.party;}
function sorted(list){return list.slice().sort(function(a,b){return a.ts===b.ts?b.seq-a.seq:(a.ts<b.ts?1:-1);});}

/* يومية المحل: كل حركات المحل بعد آخر قفل */
function isJournalType(e){return (e.type==='collect'&&e.party==='shop')||e.type==='shopExp';}
function lastClose(){var u=0;S.entries.forEach(function(e){if(e.type==='close'&&e.upTo>u)u=e.upTo;});return u;}
function isLocked(e){return e.type==='close'||(isJournalType(e)&&e.seq<=lastClose());}
function journal(){
  var up=lastClose(),rev=reversedSet(),items=[],inc=0,exp=0;
  S.entries.forEach(function(e){
    if(!isJournalType(e)||e.seq<=up)return;
    items.push(e);
    if(rev[e.id])return;
    if(e.type==='collect')inc+=e.amount;else exp+=e.amount;
  });
  return {items:sorted(items),income:r2(inc),expenses:r2(exp),net:r2(inc-exp),active:items.length>0};
}

function describe(e,ctx){
  var noteTxt=e.note?' · '+esc(e.note):'';
  var d={title:'',sub:'',amt:''};
  switch(e.type){
    case 'supply':
      d.title='توريدة من '+supName(e.sup);
      d.sub=fmtDate(e.ts)+(ctx==='stock'?' · '+n(e.cost)+' + '+sx(e.pct+'%')+' = '+n(fx(e).sale):'')+(e.paid?' · دفعت '+n(e.paid):'')+noteTxt;
      d.amt=money(e.cost);break;
    case 'pay':
      d.title='دفعة للمورد '+supName(e.sup);d.sub=fmtDate(e.ts)+noteTxt;d.amt=money(e.amount);break;
    case 'issue':
      d.title='طلعة إلى '+parName(e.party);d.sub=fmtDate(e.ts)+(e.paid?' · استلمت '+n(e.paid):'')+noteTxt;d.amt=money(e.amount);break;
    case 'collect':
      d.title=e.party==='shop'?'دفعة من المحل':'تحصيل من '+parName(e.party);
      d.sub=fmtDate(e.ts)+(e.party==='shop'?' · في اليومية':'')+noteTxt;d.amt=money(e.amount,'pos');break;
    case 'shopExp':
      d.title='مصروف المحل: '+esc(e.name);d.sub=fmtDate(e.ts)+noteTxt;d.amt=money(e.amount,'neg');break;
    case 'close':
      d.title='قفل يوم المحل';d.sub=fmtDate(e.ts)+' · دخل '+n(e.income)+' · مصروفات '+n(e.expenses);
      d.amt='<span class="'+(e.net>=0?'pos':'neg')+'">'+signed(e.net)+'<span class="unit">ج.م</span></span>';break;
    case 'deposit':
      d.title='إيداع في الخزنة';d.sub=fmtDate(e.ts)+noteTxt;d.amt=money(e.amount,'pos');break;
    case 'withdraw':
      d.title='مصروف من الخزنة';d.sub=fmtDate(e.ts)+noteTxt;d.amt=money(e.amount,'neg');break;
    case 'adjust':
      d.title='تسوية جرد الخزنة';d.sub=fmtDate(e.ts)+noteTxt;d.amt=money(Math.abs(e.amount),e.amount>0?'pos':'neg');break;
    case 'reversal':
      var o=byId(e.ref);var od=o?describe(o,ctx):{title:'حركة محذوفة'};
      d.title='إلغاء: '+od.title;d.sub=fmtDate(e.ts)+' · قيد عكسي';d.amt='';break;
  }
  if(ctx==='cash'){
    var c=fx(e).cash;
    d.amt='<span class="'+(c>0?'pos':'neg')+'">'+signed(c)+'<span class="unit">ج.م</span></span>';
  }
  return d;
}
function rowHtml(e,ctx,rev){
  var isRev=e.type==='reversal',gone=!!rev[e.id],locked=isLocked(e);
  var d=describe(e,ctx),act='',pill='';
  var dir=fx(e).cash,icn=isRev?'undo':(dir>0?'in':(dir<0?'out':'stock')),icc=isRev?'':(dir>0?'in':(dir<0?'out':''));
  if(gone)pill='<span class="pill">ملغاة</span>';
  else if(locked&&e.type!=='close')pill='<span class="pill ok">مقفول</span>';
  if(!gone&&!isRev&&!locked){
    act=(ui.pending===e.id)
      ?'<button class="link danger" data-act="cancel-go" data-id="'+e.id+'">تأكيد الإلغاء</button>'
      :'<button class="link" data-act="cancel" data-id="'+e.id+'">إلغاء</button>';
  }
  return '<li class="item'+((gone||isRev)?' void':'')+'"><span class="ico '+icc+'">'+ic(icn)+'</span><div class="main"><div class="t">'+d.title+pill+'</div><div class="s">'+d.sub+'</div></div><div class="side"><div class="amt">'+(isRev&&ctx!=='cash'?'':d.amt)+'</div>'+act+'</div></li>';
}
function listHtml(entries,ctx,emptyTitle,emptyText){
  if(!entries.length)return '<div class="empty"><b>'+emptyTitle+'</b>'+emptyText+'</div>';
  var rev=reversedSet();
  return '<ul class="list">'+entries.map(function(e){return rowHtml(e,ctx,rev);}).join('')+'</ul>';
}

/* موردين وعملاء: نفس الشكل */
function pcard(kind,id,name,total,paid,left){
  var sup=kind==='sup',pct=total>0?Math.max(0,Math.min(100,paid/total*100)):0;
  var labs=sup?['التوريد','المسدد','المتبقي']:['الطلعات','المدفوع','المتبقي'];
  return '<div class="pc" data-name="'+esc(name)+'"><div class="h"><button class="nm" data-act="'+(sup?'open-sup':'open-par')+'" data-id="'+id+'">'+esc(name)+'</button>'+
   (r2(left)===0?'<span class="pill ok">خالص</span>':'')+
   '<button class="btn sm'+(left>0?' primary':'')+'" data-act="'+(sup?'new-pay':'new-collect')+'" data-id="'+id+'">'+ic(sup?'out':'in')+(sup?'سداد':'تحصيل')+'</button></div>'+
   '<div class="tri"><div><div class="k">'+labs[0]+'</div><div class="v">'+n(total)+'</div></div><div><div class="k">'+labs[1]+'</div><div class="v pos">'+n(paid)+'</div></div><div><div class="k">'+labs[2]+'</div><div class="v '+(sup?'neg':'pos')+'">'+n(left)+'</div></div></div>'+
   '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function tot3(a,b,c,sup){
  return '<div class="card" style="margin-top:4px"><div class="tri" style="margin:0"><div><div class="k">'+a[0]+'</div><div class="v">'+n(a[1])+'</div></div><div><div class="k">'+b[0]+'</div><div class="v pos">'+n(b[1])+'</div></div><div><div class="k">'+c[0]+'</div><div class="v '+(sup?'neg':'pos')+'">'+n(c[1])+'</div></div></div></div>';
}
function searchBox(cnt){return cnt>=5?'<label class="search">'+ic('search')+'<input id="q" type="search" placeholder="بحث بالاسم" autocomplete="off" aria-label="بحث بالاسم"></label>':'';}

function vParties(T){

function render(){
  var app=document.getElementById('app');
  if(ui.locked){app.innerHTML='';renderLayer();return;}
  var T=calc(),h='';
  switch(ui.tab){
    case 'stock':h=vStock(T);break;
    case 'sup':h=vSuppliers(T);break;
    case 'cust':h=vParties(T);break;
    case 'shop':h=vShop(T);break;
    case 'cash':h=vCash(T);break;
    case 'log':h=vLog();break;
    default:h=vMore();
  }
  var tabs=[['stock','المخزن'],['sup','الموردين'],['cust','العملاء'],['shop','المحل'],['cash','الخزنة'],['log','السجل']];
  h+='<nav class="tabs" aria-label="التنقل"><div class="in">'+tabs.map(function(t){return '<button data-act="goto" data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[0])+'<span>'+t[1]+'</span></button>';}).join('')+'</div></nav>';
  var sy=window.scrollY;
  app.className=ui.all?'all':'';
  app.innerHTML=h;window.scrollTo(0,sy);
  renderLayer();
}

function fieldHtml(f){

/* القفل */
function hashPin(p){
  var s='hsb:'+p;
  try{
    if(window.crypto&&crypto.subtle){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
    }
  }catch(e){}
  return Promise.resolve('p'+btoa(s));
}
function pinKey(k){
  if(k==='⌫')ui.pinBuf=ui.pinBuf.slice(0,-1);else if(ui.pinBuf.length<4)ui.pinBuf+=k;
  ui.lockErr='';renderLayer();
  if(ui.pinBuf.length===4){
    hashPin(ui.pinBuf).then(function(h){
      if(h===S.settings.pin){ui.locked=false;ui.pinBuf='';ui.lockErr='';render();}
      else{ui.pinBuf='';ui.lockErr='الرقم غلط، جرّب تاني.';renderLayer();}
    });
  }
}
function openPinSet(){
  var has=!!S.settings.pin,fields=[];
  if(has)fields.push({name:'cur',label:'الرقم الحالي',type:'pin'});
  fields.push({name:'p1',label:'الرقم الجديد (4 أرقام)',type:'pin'},{name:'p2',label:'أعد كتابة الرقم الجديد',type:'pin'});
  openSheet({title:has?'تغيير الرقم السري':'تفعيل الرقم السري',fields:fields,submit:'حفظ',
    onSubmit:function(v){
      return (has?hashPin(v.cur):Promise.resolve(null)).then(function(h){
        if(has&&h!==S.settings.pin)return 'الرقم الحالي غلط.';
        if(!/^\d{4}$/.test(v.p1))return 'الرقم لازم يكون 4 أرقام.';
        if(v.p1!==v.p2)return 'الرقمين مش متطابقين.';
        return hashPin(v.p1).then(function(nh){S.settings.pin=nh;save();toast('تم حفظ الرقم السري');});
      });}});
}

/* النسخ الاحتياطي */
function toB64(s){var b=new TextEncoder().encode(s),bin='';b.forEach(function(x){bin+=String.fromCharCode(x);});return btoa(bin);}
function fromB64(t){var bin=atob(t),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a);}
function exportObj(){var o=JSON.parse(JSON.stringify(S));o.settings.pin=null;o.settings.lastBackup=null;return o;}
function exportText(){return 'HSB1:'+toB64(JSON.stringify(exportObj()));}
function backupFile(){
  if(!DL){doBackup();return;}
  DL.save({filename:'hesabat-'+todayStr()+'.json',data:JSON.stringify(exportObj())}).then(function(){
    S.settings.lastBackup=Date.now();save();toast('تم حفظ الملف على الموبايل');render();
  }).catch(function(e){
    if(e&&e.code==='declined'){toast('لم يتم الحفظ');return;}
    toast('تعذّر حفظ الملف، استخدم النسخ كنص');
  });
}
function readBackupFile(file){
  var r=new FileReader();r.onload=function(){doRestore(String(r.result||''));};r.onerror=function(){toast('تعذّرت قراءة الملف');};r.readAsText(file);
}
function doBackup(){
  var txt=exportText();
  function done(){S.settings.lastBackup=Date.now();save();toast('تم النسخ. الصقه في واتساب وابعته لنفسك');render();}
  function fallback(){
    var box=document.getElementById('bk'),ta=document.getElementById('bkText');
    box.hidden=false;ta.value=txt;ta.focus();ta.select();
    S.settings.lastBackup=Date.now();save();
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback);}
    else fallback();
  }catch(e){fallback();}
}
function doRestore(rawIn){
  var raw=(typeof rawIn==='string'?rawIn:(document.getElementById('rs').value||'')).trim();
  if(!raw){toast('الصق النسخة الاحتياطية الأول');return;}
  var o;
  try{
    o=JSON.parse(raw.indexOf('HSB1:')===0?fromB64(raw.slice(5)):raw);
    if(!o||!Array.isArray(o.entries)||!Array.isArray(o.suppliers))throw 0;
  }catch(e){toast('النسخة غير صالحة');return;}
  openSheet({title:'استرجاع النسخة',body:'هيتم استبدال كل البيانات الحالية بنسخة فيها '+o.entries.length+' حركة.',fields:[],submit:'استرجاع',danger:true,
    onSubmit:function(){
      var b=blank(),pin=S.settings.pin;
      o.settings=Object.assign(b.settings,o.settings||{});o.settings.pin=pin;
      S=Object.assign(b,o);save();ui.tab='stock';ui.sup=null;ui.par=null;toast('تم الاسترجاع');}});
}

    onSubmit:function(){var pin=S.settings.pin;S=blank();S.settings.pin=pin;save();ui.tab='stock';ui.sup=null;ui.par=null;toast('تم المسح');}});

  var cur='';list.forEach(function(s){if(s.id===id)cur=s.name;});
  openSheet({title:title,fields:[{name:'name',label:'الاسم',type:'text',value:cur}],submit:'حفظ',
    onSubmit:function(v){var nm=v.name.trim();if(!nm)return 'اكتب الاسم.';list.forEach(function(s){if(s.id===id)s.name=nm;});save();}});
}

/* ---------- الأحداث ---------- */
function toggleSec(sec){
  if(ui.all)return;
  sec.classList.toggle('on');
  if(sec.classList.contains('on'))setTimeout(function(){sec.classList.remove('on');},10000);
}
document.addEventListener('click',function(ev){
  var sec=ev.target.closest('.sec');
  if(sec){ev.preventDefault();toggleSec(sec);return;}
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a!=='cancel')ui.pending=null;
  switch(a){
    case 'goto':ui.tab=el.getAttribute('data-tab');ui.sup=null;ui.par=null;render();window.scrollTo(0,0);break;
    case 'eye':
      ui.all=!ui.all;clearTimeout(allTimer);
      if(ui.all)allTimer=setTimeout(function(){ui.all=false;if(!sheet&&!ui.locked)render();},60000);
      render();break;
    case 'open-sup':ui.sup=id;render();window.scrollTo(0,0);break;
    case 'back-sup':ui.sup=null;render();break;
    case 'open-par':ui.par=id;render();window.scrollTo(0,0);break;
    case 'back-par':ui.par=null;render();break;
    case 'new-sup':openSupplierForm();break;
    case 'new-party':openPartyForm();break;
    case 'new-supply':openSupply(id||ui.sup);break;
    case 'new-pay':openPay(id||ui.sup);break;
    case 'new-issue':openIssue(id||ui.par);break;
    case 'new-collect':openCollect(id||ui.par);break;
    case 'shop-collect':openShopCollect();break;
    case 'shop-exp':openShopExp();break;
    case 'shop-close':openShopClose();break;
    case 'new-deposit':openCash('deposit');break;
    case 'new-withdraw':openCash('withdraw');break;
    case 'rename-sup':openRename(S.suppliers,id,'تعديل اسم المورد');break;
    case 'rename-par':openRename(S.parties,id,'تعديل اسم العميل');break;
    case 'del-sup':
      openSheet({title:'حذف المورد',body:'المورد ملوش أي حركات، فهيتحذف نهائياً.',fields:[],submit:'حذف',danger:true,
        onSubmit:function(){S.suppliers=S.suppliers.filter(function(s){return s.id!==id;});save();ui.sup=null;toast('تم الحذف');}});break;
    case 'del-par':
      openSheet({title:'حذف العميل',body:'العميل ملوش أي حركات، فهيتحذف نهائياً.',fields:[],submit:'حذف',danger:true,
        onSubmit:function(){S.parties=S.parties.filter(function(s){return s.id!==id;});save();ui.par=null;toast('تم الحذف');}});break;
    case 'cancel':
      ui.pending=id;render();
      setTimeout(function(){if(ui.pending===id){ui.pending=null;if(!sheet&&!ui.locked)render();}},4000);break;
    case 'cancel-go':cancelEntry(id);render();break;
    case 'chip':
      var inp=document.getElementById('f_'+el.getAttribute('data-name'));
      if(inp){inp.value=el.getAttribute('data-v');updatePreview();}break;
    case 'sheet-close':closeSheet();break;
    case 'count-apply':
      var act=parseNum(document.getElementById('count').value),T=calc();
      if(!isNaN(act)){var d=r2(act-T.cash);if(d!==0){addEntry({type:'adjust',amount:d,note:'الفعلي '+fmt(act)+' والمحسوب '+fmt(T.cash)});toast('تم تسجيل الفرق');render();}}break;
    case 'backup':doBackup();break;
    case 'backup-file':backupFile();break;
    case 'restore':doRestore();break;
    case 'pin-set':openPinSet();break;
    case 'pin-off':openPinOff();break;
    case 'lock-now':ui.locked=true;ui.pinBuf='';ui.lockErr='';render();break;
    case 'wipe':openWipe();break;
    case 'key':pinKey(el.getAttribute('data-k'));break;
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){var q=ev.target.value.trim();document.querySelectorAll('.pc').forEach(function(c){c.hidden=q&&c.getAttribute('data-name').indexOf(q)<0;});}
  else if(ev.target.id==='count')countResult();
  else if(sheet&&ev.target.closest&&ev.target.closest('#sheetForm'))updatePreview();
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='rf'&&ev.target.files&&ev.target.files[0]){readBackupFile(ev.target.files[0]);ev.target.value='';}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='sheetForm')return;
  ev.preventDefault();
  var cfg=sheet;if(!cfg)return;
  Promise.resolve(cfg.onSubmit(vals())).then(function(err){
    if(typeof err==='string'&&err){var e=document.getElementById('sheetErr');if(e)e.textContent=err;return;}
    if(sheet===cfg){sheet=null;}
    render();
  });
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&sheet)closeSheet();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('sec')){ev.preventDefault();toggleSec(ev.target);return;}
  if(ui.locked&&/^[0-9]$/.test(ev.key))pinKey(ev.key);
  if(ui.locked&&ev.key==='Backspace')pinKey('⌫');
});

if(S.settings.pin){ui.locked=true;}
if(storageOk)save();
render();
})();
</script>
</body></html>
